name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Daily rebuild so the prerendered pages (what search engines and link
  # previews read) pick up content Suzy publishes in Sanity. Visitors always
  # get live content regardless. 09:00 UTC = 4–5 a.m. in Orlando.
  schedule:
    - cron: '0 9 * * *'
  # "Run workflow" button, to refresh the site right after publishing.
  workflow_dispatch:

# Never run two deploys at once (e.g. a push during the scheduled build).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: suzy-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'suzy-site/package-lock.json'

      - name: Install dependencies
        run: npm install

      # The build prerenders every page in headless Chromium.
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build

      - name: Copy build to docs
        working-directory: .
        run: |
          rm -rf docs
          cp -r suzy-site/dist docs

      - name: Commit and push docs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: deploy build [skip ci]"
          git push
