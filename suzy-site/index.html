<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Her tooth drawing. The SVG switches violet shades with the browser's
         theme; the .ico is the fallback; the PNG is the iOS home-screen icon. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved theme choice before first paint, so there's no flash of the wrong theme. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Content and images come from Sanity: open those connections early. -->
    <link rel="preconnect" href="https://ygagsfm8.apicdn.sanity.io" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <title>maybespecial — Suzy Johnson</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
